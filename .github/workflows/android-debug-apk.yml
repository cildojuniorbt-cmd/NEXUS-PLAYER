name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar esta compilação como atualização oficial"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feature/android-native-foundation
    paths:
      - 'index.html'
      - 'assets/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'update-manifest.json'
      - 'package.json'
      - 'README.md'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'android-native/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # No package-lock.json is committed, so npm cache is intentionally disabled.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Test library backup integrity
        run: npm test

      - name: Prepare web bundle
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Android app icon matching iOS
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          magick icons/nexus-player-apple-v5.png -filter Lanczos -resize 1024x1024 assets/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#080814' --iconBackgroundColorDark '#080814'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install NEXUS native updater
        run: node scripts/prepare-android-updater.mjs

      - name: Configure permanent Android signing
        id: signing
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          if [ -z "$NEXUS_KEYSTORE_BASE64" ] && [ -z "$NEXUS_KEYSTORE_PASSWORD" ] && [ -z "$NEXUS_KEY_ALIAS" ] && [ -z "$NEXUS_KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured yet. Building a debug APK for development."
            exit 0
          fi
          if [ -z "$NEXUS_KEYSTORE_BASE64" ] || [ -z "$NEXUS_KEYSTORE_PASSWORD" ] || [ -z "$NEXUS_KEY_ALIAS" ] || [ -z "$NEXUS_KEY_PASSWORD" ]; then
            echo "::error::All four NEXUS signing secrets must be configured together."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/nexus-signing"
          echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-signing/nexus-player-release.jks"
          test -s "$RUNNER_TEMP/nexus-signing/nexus-player-release.jks"
          {
            echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/nexus-signing/nexus-player-release.jks"
            echo "NEXUS_KEYSTORE_PASSWORD=$NEXUS_KEYSTORE_PASSWORD"
            echo "NEXUS_KEY_ALIAS=$NEXUS_KEY_ALIAS"
            echo "NEXUS_KEY_PASSWORD=$NEXUS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file(System.getenv('NEXUS_KEYSTORE_PATH'))
                storePassword System.getenv('NEXUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEXUS_KEY_ALIAS')
                keyPassword System.getenv('NEXUS_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          GRADLE

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK (development only)
        if: steps.signing.outputs.configured != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-player-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK for development
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-player-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Require permanent signing for official release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && steps.signing.outputs.configured != 'true'
        run: |
          echo "::error::Configure the four NEXUS signing secrets before publishing an official update."
          exit 1

      - name: Publish official Android release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-player-v41
          name: NEXUS PLAYER Android
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
